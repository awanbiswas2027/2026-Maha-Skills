[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.black]
line-length = 100
target-version = ['py311']

[project]
name = "mahaskills-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.28.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]==2.0.28",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.3",
    "celery==5.3.6",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==25.1.0",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "psycopg2-binary==2.9.9",
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    "pandas==2.2.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]
