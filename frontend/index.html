<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E3998" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />
    <title>MahaSkills - Labour-Market Intelligence Platform</title>
    <meta name="description" content="Government of Maharashtra Vocational Training & Labour Market Intelligence Platform" />
    <meta property="og:title" content="MahaSkills - Labour-Market Intelligence Platform" />
    <meta property="og:description" content="Labour-market intelligence for Maharashtra's skills system" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var p = localStorage.getItem('mahaskills.theme');
          var isDark = p === 'dark' || ((!p || p === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
